services:
  mariadb:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-vatsim_monitor}
      MYSQL_USER: ${MYSQL_USER:-vatsim_monitor}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-vatsim_monitor}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 10

  server:
    image: ${IMAGE_NAMESPACE:-kriziw}/vatsim-monitor-server:${APP_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      TRUST_PROXY: ${TRUST_PROXY:-false}
      MYSQL_HOST: mariadb
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-vatsim_monitor}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-vatsim_monitor}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-vatsim_monitor}
      MONITOR_POLL_INTERVAL_MS: ${MONITOR_POLL_INTERVAL_MS:-15000}
      LOG_DIR: ${LOG_DIR:-/app/apps/server/logs}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_MAX_FILE_SIZE_BYTES: ${LOG_MAX_FILE_SIZE_BYTES:-1048576}
      LOG_MAX_FILES: ${LOG_MAX_FILES:-5}
      VATSIM_OAUTH_ENABLED: ${VATSIM_OAUTH_ENABLED:-false}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    volumes:
      - server_logs:/app/apps/server/logs

  web:
    image: ${IMAGE_NAMESPACE:-kriziw}/vatsim-monitor-web:${APP_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      - server
    environment:
      ORIGIN: ${ORIGIN:-http://localhost:3000}
      PROTOCOL_HEADER: ${PROTOCOL_HEADER:-}
      HOST_HEADER: ${HOST_HEADER:-}
      PORT_HEADER: ${PORT_HEADER:-}
      PRIVATE_API_BASE_URL: ${PRIVATE_API_BASE_URL:-http://server:8080}
    ports:
      - "${WEB_PORT:-3000}:3000"

volumes:
  mariadb_data:
  server_logs:

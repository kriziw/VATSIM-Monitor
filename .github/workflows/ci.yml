name: CI

on:
  pull_request:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build workspace
        run: npm run build

      - name: Check workspace
        run: npm run check

      - name: Validate Docker Compose
        run: docker compose config

      - name: Build Docker images
        run: docker compose build server web

      - name: Verify server image entrypoint
        run: docker run --rm --entrypoint sh $(docker compose images -q server) -c "test -f /app/apps/server/dist/index.js"

      - name: Verify web image entrypoint
        run: docker run --rm --entrypoint sh $(docker compose images -q web) -c "test -f /app/apps/web/build/index.js"
